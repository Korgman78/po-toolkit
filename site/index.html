<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PO Toolkit — la boîte à outils du Product Owner</title>
  <meta name="description" content="Outils, méthodes, mini-apps et parcours de formation pour Product Owners et Product Managers.">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('po-toolkit-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222530'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2.5' fill='%23e8663d'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main-content">Aller au contenu</a>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Navigation principale"></nav>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-spacer"></div>
        <button class="search-trigger" id="search-trigger" aria-label="Rechercher (Ctrl K)"></button>
        <button class="icon-btn" id="theme-toggle" aria-label="Changer de thème"></button>
        <div class="read-progress" id="read-progress"></div>
      </header>
      <main class="content" id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Recherche">
    <div class="palette-box">
      <label class="palette-input">
        <span id="palette-icon"></span>
        <input id="palette-input" type="text" placeholder="Rechercher un outil, une méthode, un chapitre…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-results">
        <kbd>Échap</kbd>
      </label>
      <div class="palette-results" id="palette-results" role="listbox"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> naviguer</span>
        <span><kbd>↵</kbd> ouvrir</span>
        <span><kbd>Échap</kbd> fermer</span>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="formation-data.js"></script>
  <script src="formation-cicd.js"></script>
  <script src="formation-ia-safe.js"></script>
  <script src="formation-projet-produit.js"></script>
  <script src="formation-ia-quotidien.js"></script>
  <script src="script.js"></script>
</body>
</html>
