<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Standup Timer</title>
<link rel="stylesheet" href="app-kit.css">
<script src="app-kit.js"></script>
<style>
  .page { width: 100%; max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; display: flex; flex-direction: column; gap: 20px; }
  .kit-head { text-align: center; align-items: center; }

  .card { padding: 24px; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
  .card h2 { font-family: var(--font-serif); font-size: 22px; font-weight: 500; margin-bottom: 16px; }

  .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 13.5px; color: var(--text-2); }
  .settings-row input { width: 76px; height: 34px; padding: 0 8px; text-align: center; font-family: var(--font-mono); }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; height: 34px; padding: 0 12px; }

  .member-list { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--border-soft); }
  .member-list:empty { display: none; }
  .member-list li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border-soft); }
  .member-list li .idx { width: 20px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-4); }
  .member-list li .name { flex: 1; font-weight: 500; }
  .member-list li .remove { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--text-4); cursor: pointer; font-size: 16px; line-height: 1; }
  .member-list li .remove:hover { background: var(--danger-soft); color: var(--danger); }
  .btn-block { width: 100%; height: 42px; margin-top: 20px; font-size: 14px; }

  /* Minuteur */
  #app-timer { display: none; text-align: center; }
  .progress-ring { position: relative; width: 280px; height: 280px; margin: 8px auto 0; }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring circle { fill: none; stroke-width: 6; }
  .progress-ring .bg { stroke: var(--surface-3); }
  .progress-ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
  .progress-ring .fg.warning { stroke: var(--warn); }
  .progress-ring .fg.danger { stroke: var(--danger); }
  .timer-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .person-label { font-family: var(--font-serif); font-size: 24px; font-weight: 500; color: var(--text); }
  .person-time { font-family: var(--font-mono); font-size: 44px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--text); }
  .timer-meta { display: flex; justify-content: center; align-items: baseline; gap: 14px; margin-top: 18px; color: var(--text-3); font-size: 13.5px; }
  .timer-display { font-family: var(--font-mono); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-2); transition: color 0.3s; }
  .timer-display.warning { color: var(--warn-text); }
  .timer-display.danger { color: var(--danger); }
  .controls { display: flex; justify-content: center; gap: 8px; margin-top: 22px; }
  .controls .btn-primary { min-width: 140px; }

  /* Récap */
  #app-summary { display: none; }
  .summary-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  .summary-row:last-child { border-bottom: 0; }
  .summary-row .time { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .summary-row .over { color: var(--danger); }
  .total-time { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--border); font-weight: 600; }
  .total-time .value { font-family: var(--font-mono); font-size: 15px; }
  .total-time .ok { color: var(--success); }
  .total-time .ko { color: var(--danger); }
</style>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="ably-config.js"></script>
<script src="ably-sync.js"></script>
</head>
<body data-app="Daily Standup Timer">
<main class="page">
<header class="kit-head">
  <h1>Daily Standup Timer</h1>
  <p>Un tour de parole minuté pour tenir le daily en 15 minutes.</p>
</header>

<div class="session-bar">
  <span class="session-status" title="Session active"></span>
  <label for="session-id">Session</label>
  <input type="text" id="session-id" value="" placeholder="session-id" onchange="changeSession(this.value)">
  <button onclick="newSession()">Nouvelle</button>
  <button onclick="copySessionLink(this)">Copier le lien</button>
</div>

<div id="app-setup">
  <section class="card">
    <h2>Équipe</h2>
    <div class="settings-row">
      <label for="time-per-person">Temps par personne</label>
      <input type="number" id="time-per-person" value="90" min="30" max="300" step="15">
      <span>secondes</span>
    </div>
    <div class="input-row">
      <input type="text" id="member-input" placeholder="Nom du membre" onkeydown="if(event.key==='Enter')addMember()">
      <button class="btn-secondary" onclick="addMember()">Ajouter</button>
    </div>
    <ul class="member-list" id="member-list"></ul>
    <button class="btn-primary btn-block" onclick="startStandup()" id="start-btn" disabled>Démarrer le daily</button>
  </section>
</div>

<div id="app-timer">
  <div class="progress-ring">
    <svg width="280" height="280">
      <circle class="bg" cx="140" cy="140" r="130"></circle>
      <circle class="fg" id="progress-circle" cx="140" cy="140" r="130"></circle>
    </svg>
    <div class="timer-center">
      <div class="person-label" id="current-person"></div>
      <div class="person-time" id="person-time">1:30</div>
    </div>
  </div>
  <div class="timer-meta">
    <span id="counter-label">Personne 1/4</span>
    <span>Total <span class="timer-display" id="total-timer">0:00</span></span>
  </div>
  <div class="controls">
    <button class="btn-secondary" onclick="togglePause()" id="pause-btn">Pause</button>
    <button class="btn-primary" onclick="nextPerson()" id="next-btn">Suivant</button>
    <button class="btn-ghost" onclick="endStandup()">Terminer</button>
  </div>
</div>

<div id="app-summary">
  <section class="card">
    <h2>Récap du daily</h2>
    <div id="summary-list"></div>
    <div class="total-time" id="total-time-summary"></div>
    <button class="btn-primary btn-block" onclick="resetApp()">Nouveau daily</button>
  </section>
</div>
</main>

<script>
const APP_KEY = 'daily-timer';
let members = [];
let currentIdx = 0;
let personSeconds = 0;
let totalSeconds = 0;
let maxPersonSeconds = 90;
let running = false;
let paused = false;
let timerInterval = null;
let personTimes = [];
const circumference = 2 * Math.PI * 130;

// ---- Session functions ----
function getSessionData() {
  return { members: members, timePerPerson: document.getElementById('time-per-person').value };
}
function restoreSessionData(data) {
  members = data.members || [];
  document.getElementById('time-per-person').value = data.timePerPerson || 90;
  renderMembers();
}
function resetSessionData() {
  members = [];
  document.getElementById('time-per-person').value = 90;
  renderMembers();
}


// ---- Session Management ----
function generateSessionId() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

function getSessionId() {
  const params = new URLSearchParams(window.location.search);
  const urlSession = params.get('session');
  if (urlSession) return urlSession;
  const stored = localStorage.getItem(APP_KEY + '-last-session');
  return stored || generateSessionId();
}

function changeSession(newId) {
  if (!newId.trim()) return;
  const id = newId.trim().toUpperCase();
  document.getElementById('session-id').value = id;
  localStorage.setItem(APP_KEY + '-last-session', id);
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('session', id);
  window.history.replaceState({}, '', url);
  loadSession();
}

function newSession() {
  changeSession(generateSessionId());
}

function copySessionLink(btn) {
  const id = document.getElementById('session-id').value;
  const url = new URL(window.location);
  url.searchParams.set('session', id);
  navigator.clipboard.writeText(url.toString()).then(() => {
    btn.textContent = 'Copié !';
    setTimeout(() => btn.textContent = 'Copier le lien', 2000);
  });
}

let _ablyReceiving = false;
function saveSession() {
  const id = document.getElementById('session-id').value;
  const key = APP_KEY + '-session-' + id;
  const data = getSessionData();
  localStorage.setItem(key, JSON.stringify(data));
  localStorage.setItem(APP_KEY + '-last-session', id);
  if (!_ablyReceiving && window.ablySync) ablySync.broadcast(data);
}

function loadSession() {
  const id = document.getElementById('session-id').value;
  const key = APP_KEY + '-session-' + id;
  const data = localStorage.getItem(key);
  if (data) {
    try { restoreSessionData(JSON.parse(data)); } catch(e) { console.warn('Session restore failed', e); }
  } else {
    resetSessionData();
  }
}

function initSession() {
  const id = getSessionId();
  document.getElementById('session-id').value = id;
  localStorage.setItem(APP_KEY + '-last-session', id);
  const url = new URL(window.location);
  url.searchParams.set('session', id);
  window.history.replaceState({}, '', url);
  loadSession();
}


function addMember() {
  const input = document.getElementById('member-input');
  const name = input.value.trim();
  if (!name) return;
  members.push(name);
  input.value = '';
  input.focus();
  renderMembers();
}

function removeMember(idx) {
  members.splice(idx, 1);
  renderMembers();
}

function renderMembers() {
  const list = document.getElementById('member-list');
  list.innerHTML = members.map((m, i) =>
    `<li><span class="idx">${String(i + 1).padStart(2, '0')}</span><span class="name">${m}</span><button class="remove" onclick="removeMember(${i})" aria-label="Retirer ${m}">&times;</button></li>`
  ).join('');
  document.getElementById('start-btn').disabled = members.length === 0;
  saveSession();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function startStandup() {
  maxPersonSeconds = parseInt(document.getElementById('time-per-person').value) || 90;
  shuffleArray(members);
  personTimes = members.map(() => 0);
  currentIdx = 0;
  personSeconds = 0;
  totalSeconds = 0;
  running = true;
  paused = false;

  document.getElementById('app-setup').style.display = 'none';
  document.getElementById('app-timer').style.display = 'block';
  document.getElementById('app-summary').style.display = 'none';

  const circle = document.getElementById('progress-circle');
  circle.style.strokeDasharray = circumference;
  circle.style.strokeDashoffset = 0;

  updateDisplay();
  timerInterval = setInterval(tick, 1000);
}

function tick() {
  if (paused) return;
  personSeconds++;
  totalSeconds++;
  personTimes[currentIdx] = personSeconds;
  updateDisplay();
}

function updateDisplay() {
  const personLeft = Math.max(0, maxPersonSeconds - personSeconds);
  const mins = Math.floor(personLeft / 60);
  const secs = personLeft % 60;
  document.getElementById('person-time').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  document.getElementById('current-person').textContent = members[currentIdx];
  document.getElementById('counter-label').textContent = `Personne ${currentIdx + 1}/${members.length}`;

  const totalMins = Math.floor(totalSeconds / 60);
  const totalSecs = totalSeconds % 60;
  const totalDisplay = document.getElementById('total-timer');
  totalDisplay.textContent = `${totalMins}:${totalSecs.toString().padStart(2, '0')}`;

  // Progress ring
  const circle = document.getElementById('progress-circle');
  const progress = Math.min(personSeconds / maxPersonSeconds, 1);
  circle.style.strokeDashoffset = circumference * (1 - progress);

  // Warning states
  const ratio = personSeconds / maxPersonSeconds;
  circle.classList.remove('warning', 'danger');
  totalDisplay.classList.remove('warning', 'danger');
  if (ratio >= 1) {
    circle.classList.add('danger');
    totalDisplay.classList.add('danger');
  } else if (ratio >= 0.75) {
    circle.classList.add('warning');
    totalDisplay.classList.add('warning');
  }
}

function nextPerson() {
  if (currentIdx < members.length - 1) {
    currentIdx++;
    personSeconds = 0;
    updateDisplay();
  } else {
    endStandup();
  }
}

function togglePause() {
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Reprendre' : 'Pause';
}

function endStandup() {
  running = false;
  clearInterval(timerInterval);
  document.getElementById('app-timer').style.display = 'none';
  document.getElementById('app-summary').style.display = 'block';

  let html = '';
  for (let i = 0; i < members.length; i++) {
    const t = personTimes[i] || 0;
    const m = Math.floor(t / 60);
    const s = t % 60;
    const over = t > maxPersonSeconds ? ' over' : '';
    html += `<div class="summary-row"><span>${members[i]}</span><span class="time${over}">${m}:${s.toString().padStart(2, '0')}</span></div>`;
  }
  document.getElementById('summary-list').innerHTML = html;

  const tm = Math.floor(totalSeconds / 60);
  const ts = totalSeconds % 60;
  const cls = totalSeconds > 900 ? 'ko' : 'ok';
  document.getElementById('total-time-summary').innerHTML = `<span>Total</span><span class="value ${cls}">${tm}:${ts.toString().padStart(2, '0')}</span>`;
}

function resetApp() {
  // Keep team members for the current session to avoid retyping names.
  running = false;
  paused = false;
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  currentIdx = 0;
  personSeconds = 0;
  totalSeconds = 0;
  personTimes = [];
  document.getElementById('pause-btn').textContent = 'Pause';

  document.getElementById('app-setup').style.display = 'block';
  document.getElementById('app-timer').style.display = 'none';
  document.getElementById('app-summary').style.display = 'none';
  renderMembers();
}

// ---- Sync (cross-tab + Ably real-time) ----
function mergeIncoming(incoming) {
  if (running) return; // Don't disrupt an active standup
  restoreSessionData(incoming);
}

window.addEventListener('storage', (event) => {
  const id = document.getElementById('session-id').value;
  if (event.key !== APP_KEY + '-session-' + id || !event.newValue) return;
  try {
    _ablyReceiving = true;
    mergeIncoming(JSON.parse(event.newValue));
    _ablyReceiving = false;
  } catch(e) { _ablyReceiving = false; }
});

// Ably real-time (cross-device)
function joinAblyChannel() {
  if (!window.ablySync) return;
  const id = document.getElementById('session-id').value;
  ablySync.join('standup:' + id, (data) => {
    try {
      _ablyReceiving = true;
      mergeIncoming(data);
      _ablyReceiving = false;
    } catch(e) { _ablyReceiving = false; }
  });
}

// Init
initSession();
joinAblyChannel();
</script>
</body>
</html>
