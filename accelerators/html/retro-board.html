<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Board — PO Toolkit</title>
<link rel="stylesheet" href="app-kit.css">
<script src="app-kit.js"></script>
<style>
  :root { --card: var(--surface); --muted: var(--text-3); --green: var(--success); --red: var(--danger); --blue: var(--accent); }
  .page { width: 100%; max-width: 1360px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 18px; }
  .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Barres du haut */
  .top-bars { display: flex; gap: 10px; flex-wrap: wrap; }
  .top-bars .session-bar { flex: 1.4; min-width: 300px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); font-size: 13px; color: var(--text-3); }
  .bar label { white-space: nowrap; }
  .pseudo-bar { flex: 1; min-width: 220px; }
  .pseudo-bar input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; font-weight: 500; }

  /* Interrupteur */
  .toggle-wrap { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .toggle { position: relative; width: 34px; height: 20px; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); transition: background 0.15s, border-color 0.15s; }
  .toggle span::before { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform 0.15s var(--ease); }
  .toggle input:checked + span { background: var(--accent); border-color: var(--accent); }
  .toggle input:checked + span::before { transform: translateX(14px); }
  .toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Modales */
  .modal input { width: 100%; height: 40px; padding: 0 12px; margin-bottom: 12px; font-size: 15px; }
  .modal input.is-invalid { border-color: var(--danger); }
  .modal .mbtn { width: 100%; height: 40px; }

  /* Sprint + format */
  .settings { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
  .sprint-input, .template-bar { display: flex; align-items: center; gap: 10px; }
  .settings .lbl { font-size: 13px; color: var(--text-3); }
  .sprint-input input { width: 280px; height: 34px; padding: 0 12px; }
  .template-seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  .tbtn { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text-3); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .tbtn:hover { color: var(--text); }
  .tbtn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

  /* Colonnes */
  .board { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; align-items: start; }
  .column { --tone: var(--t6-fg); --tone-bg: var(--t6-bg); display: flex; flex-direction: column; min-height: 380px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-2); overflow: hidden; }
  .column-header { padding: 14px 14px 12px; border-top: 3px solid var(--tone); background: var(--tone-bg); }
  .column-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: var(--tone); }
  .column-title .swatch { display: none; }
  .column-title .name { flex: 1; }
  .column-title .count { min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--tone); font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; line-height: 22px; text-align: center; color: var(--surface); }
  .column-desc { margin-top: 3px; font-size: 12.5px; line-height: 1.45; color: color-mix(in oklab, var(--tone) 70%, var(--text-2)); }
  .tone-1 { --tone: var(--t1-fg); --tone-bg: var(--t1-bg); }
  .tone-2 { --tone: var(--t2-fg); --tone-bg: var(--t2-bg); }
  .tone-3 { --tone: var(--t3-fg); --tone-bg: var(--t3-bg); }
  .tone-4 { --tone: var(--t4-fg); --tone-bg: var(--t4-bg); }
  .tone-5 { --tone: var(--t5-fg); --tone-bg: var(--t5-bg); }
  .tone-6 { --tone: var(--t6-fg); --tone-bg: var(--t6-bg); }
  .column-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; }
  .column-body:empty::before { content: 'Aucune carte pour le moment'; margin: auto; font-size: 12.5px; color: var(--text-4); }
  .add-area { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-top: 1px solid var(--border-soft); }
  .add-area textarea { width: 100%; min-height: 56px; padding: 8px 10px; resize: none; font-size: 13.5px; line-height: 1.45; }
  .add-area .btn-secondary { width: 100%; }

  /* Cartes */
  .rcard { padding: 10px 12px 10px 13px; border: 1px solid var(--border); border-left: 3px solid var(--tone); border-radius: 9px; background: var(--surface); box-shadow: var(--shadow-sm); }
  .rcard.top { box-shadow: 0 0 0 1px color-mix(in oklab, var(--tone) 35%, transparent), var(--shadow-sm); }
  .rcard .txt { margin-bottom: 8px; font-size: 14px; line-height: 1.5; word-break: break-word; color: var(--text); }
  .rcard .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rcard .meta-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rcard .author { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcard .author .ma { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 9.5px; font-weight: 600; flex-shrink: 0; }
  .vbtn { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-3); font-family: var(--font-mono); font-size: 11.5px; cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s; }
  .vbtn svg { display: block; }
  .vbtn:hover { border-color: var(--app); color: var(--app); }
  .vbtn.voted { border-color: var(--app); background: var(--app); color: var(--surface); }
  .del { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--text-4); font-size: 15px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity 0.12s, background 0.12s, color 0.12s; }
  .rcard:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: var(--danger-soft); color: var(--danger); }
  @media (hover: none) { .del { opacity: 1; } }

  /* Export */
  .export-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); }
  .export-modal.open { display: flex; }
  .export-content { width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto; padding: 26px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lg); }
  .export-content h2 { margin-bottom: 14px; font-family: var(--font-serif); font-size: 24px; font-weight: 500; }
  .export-content pre { margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; }
  .export-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* Participants */
  .participants-section { padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
  .participants-section h3 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .participants-section h3 span { font-weight: 400; font-size: 12.5px; color: var(--text-3); }
  #participants-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .participant { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500; }
  .p-avatar { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 10.5px; font-weight: 600; }
  .owner-tag { font-size: 11.5px; font-weight: 400; color: var(--accent-text); }

  button:disabled, .tbtn:disabled { opacity: 0.4; pointer-events: none; }
  input[readonly] { opacity: 0.7; cursor: not-allowed; }

  @media (max-width: 1100px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    .page { padding: 24px 16px 48px; }
    .board { grid-template-columns: 1fr; }
    .sprint-input input { width: 100%; }
    .sprint-input { flex: 1; }
  }
  /* ===== Speed Boat : scène illustrée ===== */
  .sb-scene {
    --sky-1: #e8f3f6; --sky-2: #cde6ee; --sea-1: #74b4c4; --sea-2: #2f7d92; --cloud: #ffffff; --sun: #f4c15d;
    position: relative; width: 100%; min-height: 720px; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sea-1) 45%, var(--sea-2) 100%);
  }
  [data-theme="dark"] .sb-scene { --sky-1: #0e1b2c; --sky-2: #1a3550; --sea-1: #17496b; --sea-2: #0a1e33; --cloud: #c9d6e3; --sun: #efe6cf; }
  .sb-sun { position: absolute; top: 6%; left: 60%; width: 64px; height: 64px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 12px color-mix(in oklab, var(--sun) 25%, transparent), 0 0 60px 10px color-mix(in oklab, var(--sun) 35%, transparent); pointer-events: none; }
  .sb-cloud { position: absolute; pointer-events: none; color: var(--cloud); animation: sbDrift 70s ease-in-out infinite alternate; }
  .sb-cloud svg { display: block; fill: currentColor; }
  @keyframes sbDrift { from { transform: translateX(0); } to { transform: translateX(60px); } }

  .sb-water { position: absolute; top: calc(45% - 10px); left: 0; right: 0; height: 22px; overflow: hidden; pointer-events: none; }
  .sb-water svg { width: 200%; height: 22px; display: block; animation: sbWave 9s linear infinite; }
  .sb-water.back { top: calc(45% - 4px); opacity: 0.6; }
  .sb-water.back svg { animation-duration: 14s; animation-direction: reverse; }
  @keyframes sbWave { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .sb-boat-container { position: absolute; top: 45%; left: 50%; z-index: 5; transform: translate(-50%, -86%); text-align: center; pointer-events: none; }
  .sb-boat-container svg { display: block; animation: sbBob 4.5s ease-in-out infinite; transform-origin: 50% 85%; }
  @keyframes sbBob { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(5px) rotate(1.2deg); } }
  .sb-boat-label { position: absolute; top: calc(100% + 26px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 12px; border-radius: 999px; background: color-mix(in oklab, var(--surface) 85%, transparent); color: var(--text); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; box-shadow: var(--shadow-sm); }

  .sb-zone { position: absolute; z-index: 10; display: flex; flex-direction: column; gap: 8px; width: 29%; }
  .sb-zone-wind { top: 4%; left: 3%; }
  .sb-zone-island { top: 4%; right: 3%; }
  .sb-zone-anchor { bottom: 4%; left: 3%; }
  .sb-zone-rock { bottom: 4%; right: 3%; }
  .sb-zone-head { display: flex; align-items: center; gap: 10px; }
  .sb-zone-head svg { flex-shrink: 0; }
  .sb-zone-label { display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border: 1px solid color-mix(in oklab, var(--tone) 45%, transparent); border-radius: 999px; background: color-mix(in oklab, var(--surface) 92%, transparent); color: var(--tone); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-sm); }
  .sb-zone-label .count { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--tone); color: var(--surface); font-family: var(--font-mono); font-size: 11px; line-height: 20px; text-align: center; }
  .sb-zone-label small { display: block; font-size: 11.5px; font-weight: 400; color: var(--text-3); }
  .sb-zone .cards-container { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow-y: auto; padding: 2px; }
  .sb-zone .add-mini { height: 30px; border: 1px dashed color-mix(in oklab, var(--tone) 55%, var(--border)); border-radius: 8px; background: color-mix(in oklab, var(--surface) 78%, transparent); color: var(--tone); font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background 0.12s; }
  .sb-zone .add-mini:hover { background: var(--surface); }

  /* Modale d'ajout */
  .sb-input-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); }
  .sb-input-modal.open { display: flex; }
  .sb-input-box { width: 100%; max-width: 420px; padding: 22px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lg); }
  .sb-input-box h3 { margin-bottom: 12px; font-family: var(--font-serif); font-size: 22px; font-weight: 500; color: var(--tone, var(--text)); }
  .sb-input-box textarea { display: block; width: 100%; min-height: 90px; margin-bottom: 12px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
  .sb-input-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .sb-water svg, .sb-boat-container svg, .sb-cloud { animation: none; }
  }
  @media (max-width: 900px) {
    .sb-scene { min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 14px; background: linear-gradient(180deg, var(--sky-1), var(--sea-2)); }
    .sb-zone { position: relative; inset: auto !important; width: 100%; }
    .sb-boat-container, .sb-water, .sb-sun, .sb-cloud { display: none; }
  }
</style>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="ably-config.js"></script>
<script src="ably-sync.js"></script>
</head>
<body data-app="Retro Board" data-tint="5" data-icon="message" data-section="Planification &amp; facilitation">

<!-- Pseudo modal -->
<div class="modal-overlay" id="pseudo-modal">
  <div class="modal">
    <h2>Bienvenue</h2>
    <p>Entrez votre pseudo pour rejoindre la rétrospective.</p>
    <input type="text" id="pseudo-input" placeholder="Votre pseudo" autofocus onkeydown="if(event.key==='Enter')confirmPseudo()">
    <button class="btn-primary mbtn" onclick="confirmPseudo()">Rejoindre</button>
  </div>
</div>

<!-- Speed Boat : ajout d'un item -->
<div class="sb-input-modal" id="sb-input-modal" onclick="if(event.target === this) sbAddCancel()">
  <div class="sb-input-box">
    <h3 id="sb-input-title">Ajouter un item</h3>
    <textarea id="sb-input-text" placeholder="Votre item (Ctrl+Entrée pour valider)" onkeydown="if(event.ctrlKey && event.key==='Enter')sbAddConfirm(); if(event.key==='Escape')sbAddCancel();"></textarea>
    <div class="sb-input-actions">
      <button class="btn-secondary" onclick="sbAddCancel()">Annuler</button>
      <button class="btn-primary" onclick="sbAddConfirm()">Ajouter</button>
    </div>
  </div>
</div>

<main class="page">
<div class="page-header">
  <div class="kit-head">
    <h1>Retro Board</h1>
    <p>Collectez les retours de l'équipe, votez pour prioriser, repartez avec des actions.</p>
  </div>
  <div class="header-actions">
    <button class="btn-secondary" onclick="exportRetro()">Exporter</button>
    <button class="btn-ghost" onclick="clearAll()">Tout effacer</button>
  </div>
</div>

<div class="top-bars">
  <div class="session-bar">
    <span class="dot"></span>
    <label for="session-id">Session</label>
    <input type="text" id="session-id" value="" placeholder="ID" onchange="changeSession(this.value)">
    <button onclick="newSession()">Nouvelle</button>
    <button onclick="copySessionLink(this)">Copier le lien</button>
  </div>
  <div class="bar pseudo-bar">
    <span class="kit-avatar" id="my-avatar">?</span>
    <label for="my-pseudo">Pseudo</label>
    <input type="text" id="my-pseudo" value="" onchange="changePseudo(this.value)">
  </div>
  <div class="bar">
    <div class="toggle-wrap">
      <label for="anon-cb">Anonyme</label>
      <label class="toggle"><input type="checkbox" id="anon-cb" onchange="toggleAnon()"><span></span></label>
    </div>
  </div>
</div>

<div class="settings">
  <div class="sprint-input">
    <label class="lbl" for="sprint-name">Sprint</label>
    <input type="text" id="sprint-name" placeholder="Sprint 12 — 01/04 au 12/04">
  </div>
  <div class="template-bar">
    <span class="lbl">Format</span>
    <div class="template-seg">
      <button class="tbtn active" onclick="setTpl('classic',this)">Classique</button>
      <button class="tbtn" onclick="setTpl('4l',this)">4L</button>
      <button class="tbtn" onclick="setTpl('starfish',this)">Starfish</button>
      <button class="tbtn" onclick="setTpl('speedboat',this)">Speed Boat</button>
    </div>
  </div>
</div>

<div id="board-container"></div>

<div class="participants-section">
  <h3>Participants <span id="participants-count"></span></h3>
  <div id="participants-list"></div>
</div>
</main>

<div class="export-modal" id="export-modal" onclick="if(event.target === this) closeExport()">
  <div class="export-content">
    <h2>Export de la rétrospective</h2>
    <pre id="export-text"></pre>
    <div class="export-actions">
      <button class="btn-secondary" onclick="closeExport()">Fermer</button>
      <button class="btn-primary" onclick="copyExport(this)">Copier</button>
    </div>
  </div>
</div>

<script>
const APP_KEY = 'retro-board';
const COLORS = ['#ec4899','#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#d946ef','#f97316','#14b8a6'];

const TPL = {
  classic: {
    cols: [
      { id:'good', title:'Ce qui a bien marché', desc:"Ce qu'on veut garder.", tone:3 },
      { id:'improve', title:'À améliorer', desc:'Ce qui a freiné ou frustré.', tone:1 },
      { id:'action', title:'Actions', desc:'Engagements concrets pour le prochain sprint.', tone:5 },
    ]
  },
  '4l': {
    cols: [
      { id:'liked', title:'Liked', desc:"Ce qu'on a apprécié.", tone:3 },
      { id:'learned', title:'Learned', desc:"Ce qu'on a appris.", tone:4 },
      { id:'lacked', title:'Lacked', desc:'Ce qui nous a manqué.', tone:1 },
      { id:'longed', title:'Longed for', desc:"Ce qu'on aurait aimé avoir.", tone:2 },
    ]
  },
  starfish: {
    cols: [
      { id:'keep', title:'Keep doing', desc:'Ce qui marche, à continuer.', tone:3 },
      { id:'more', title:'More of', desc:'À faire davantage.', tone:4 },
      { id:'less', title:'Less of', desc:'À réduire.', tone:2 },
      { id:'stop', title:'Stop doing', desc:'À arrêter.', tone:1 },
      { id:'start', title:'Start doing', desc:'À essayer.', tone:5 },
    ]
  },
  speedboat: {
    cols: [
      { id:'island', title:'Objectif', desc:"L'île vers laquelle on navigue.", tone:3 },
      { id:'wind', title:'Vent', desc:'Ce qui nous propulse.', tone:4 },
      { id:'anchor', title:'Ancres', desc:'Ce qui nous ralentit.', tone:2 },
      { id:'rock', title:'Récifs', desc:'Les risques à venir.', tone:1 },
    ]
  }
};

let currentTpl = 'classic';
let columns = {};
let myPseudo = '';
let isAnon = false;
let sessionOwner = '';
let participants = []; // { pseudo, color }

function isOwner() { return myPseudo && myPseudo === sessionOwner; }

function applyOwnerLock() {
  const locked = !isOwner() && sessionOwner;
  document.querySelectorAll('.tbtn').forEach(b => b.disabled = locked);
  document.getElementById('sprint-name').readOnly = locked;
  document.getElementById('anon-cb').disabled = locked;
}

function ensureParticipant() {
  if (myPseudo && !participants.find(p => p.pseudo === myPseudo)) {
    participants.push({ pseudo: myPseudo, color: getColor(myPseudo) });
  }
}

function renderParticipants() {
  const el = document.getElementById('participants-list');
  if (!el) return;
  const countEl = document.getElementById('participants-count');
  if (countEl) countEl.textContent = `${participants.length}`;
  el.innerHTML = participants.map(p =>
    `<div class="participant ${p.pseudo === sessionOwner ? 'is-owner' : ''}">
      <div class="p-avatar tint-${tintOf(p.pseudo)}">${avatarLetter(p.pseudo)}</div>
      <span>${esc(p.pseudo)}</span>
      ${p.pseudo === sessionOwner ? '<span class="owner-tag">animateur</span>' : ''}
    </div>`
  ).join('');
}

// ---- Utils ----
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function avatarLetter(n) { return (n||'?')[0].toUpperCase(); }
function tintOf(p) { let h=0; p=p||''; for(let i=0;i<p.length;i++) h=p.charCodeAt(i)+((h<<5)-h); return (Math.abs(h)%6)+1; }
function getColor(p) { let h=0; for(let i=0;i<p.length;i++) h=p.charCodeAt(i)+((h<<5)-h); return COLORS[Math.abs(h)%COLORS.length]; }

function confirmPseudo() {
  const v = document.getElementById('pseudo-input').value.trim();
  if(!v) { document.getElementById('pseudo-input').classList.add('is-invalid'); return; }
  myPseudo = v;
  localStorage.setItem(APP_KEY+'-pseudo', myPseudo);
  document.getElementById('pseudo-modal').classList.add('hidden');
  document.getElementById('my-pseudo').value = myPseudo;
  document.getElementById('my-avatar').textContent = avatarLetter(myPseudo);
  document.getElementById('my-avatar').className = 'kit-avatar tint-' + tintOf(myPseudo);
}
function changePseudo(v) {
  if(!v.trim()) return;
  myPseudo = v.trim();
  localStorage.setItem(APP_KEY+'-pseudo', myPseudo);
  document.getElementById('my-avatar').textContent = avatarLetter(myPseudo);
  document.getElementById('my-avatar').className = 'kit-avatar tint-' + tintOf(myPseudo);
  render();
}
function toggleAnon() { isAnon = document.getElementById('anon-cb').checked; render(); save(); }

// ---- Template ----
function setTpl(name, btn) {
  if(btn) { document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  currentTpl = name;
  columns = {};
  TPL[name].cols.forEach(c => { columns[c.id] = { ...c, cards: [] }; });
  render(); save();
}

// ---- Card rendering helper ----
const VOTE_ICON = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8H1z" fill="currentColor"/></svg>';
function cardHTML(colId, card, i) {
  const showA = !isAnon && card.author;
  return `<div class="rcard ${i === 0 && card.votes > 0 ? 'top' : ''}">
    <div class="txt">${esc(card.text)}</div>
    <div class="meta">
      <div class="meta-left">
        <button class="vbtn ${card.voted?'voted':''}" onclick="vote('${colId}',${i})" aria-label="Voter">${VOTE_ICON}${card.votes}</button>
        ${showA ? `<span class="author"><span class="ma tint-${tintOf(card.author)}">${avatarLetter(card.author)}</span>${esc(card.author)}</span>` : ''}
      </div>
      <button class="del" onclick="delCard('${colId}',${i})" aria-label="Supprimer la carte">&times;</button>
    </div>
  </div>`;
}

function colMeta(col) {
  return TPL[currentTpl].cols.find(c => c.id === col.id) || { title: col.title, desc: '', tone: 6 };
}

// ---- RENDER ----
function render() {
  if (currentTpl === 'speedboat') return renderSpeedBoat();
  const container = document.getElementById('board-container');
  const cols = Object.values(columns);
  container.innerHTML = `<div class="board" style="--cols:${cols.length}">${cols.map(col => {
    const m = colMeta(col);
    return `
    <div class="column tone-${m.tone}">
      <div class="column-header">
        <div class="column-title"><span class="swatch"></span><span class="name">${m.title}</span><span class="count">${col.cards.length}</span></div>
        ${m.desc ? `<div class="column-desc">${m.desc}</div>` : ''}
      </div>
      <div class="column-body">${col.cards.sort((a,b)=>b.votes-a.votes).map((c,i) => cardHTML(col.id, c, i)).join('')}</div>
      <div class="add-area">
        <textarea id="in-${col.id}" placeholder="Ajouter une carte (Ctrl+Entrée)" onkeydown="if(event.ctrlKey&&event.key==='Enter')addCard('${col.id}')"></textarea>
        <button class="btn-secondary btn-small" onclick="addCard('${col.id}')">Ajouter</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

let sbAddTarget = null;
function sbAddOpen(colId) {
  sbAddTarget = colId;
  const m = colMeta(columns[colId]);
  const box = document.querySelector('.sb-input-box');
  box.className = `sb-input-box tone-${m.tone}`;
  document.getElementById('sb-input-title').textContent = m.title;
  document.getElementById('sb-input-text').value = '';
  document.getElementById('sb-input-modal').classList.add('open');
  setTimeout(() => document.getElementById('sb-input-text').focus(), 50);
}
function sbAddCancel() { document.getElementById('sb-input-modal').classList.remove('open'); sbAddTarget = null; }
function sbAddConfirm() {
  const txt = document.getElementById('sb-input-text').value.trim();
  if (!txt || !sbAddTarget) return;
  columns[sbAddTarget].cards.push({ text: txt, votes: 0, voted: false, author: myPseudo || 'Anonyme' });
  sbAddCancel();
  render(); save();
}

// ---- Card actions ----
function addCard(colId) {
  const input = document.getElementById(`in-${colId}`);
  const txt = input.value.trim();
  if (!txt) return;
  columns[colId].cards.push({ text: txt, votes: 0, voted: false, author: myPseudo || 'Anonyme' });
  input.value = '';
  render(); save();
}

function delCard(colId, i) {
  columns[colId].cards.splice(i, 1);
  render(); save();
}

function vote(colId, i) {
  const card = columns[colId].cards[i];
  if (card.voted) { card.votes--; card.voted = false; }
  else { card.votes++; card.voted = true; }
  render(); save();
}

function clearAll() {
  if (!confirm('Effacer toutes les cartes ?')) return;
  Object.values(columns).forEach(col => col.cards = []);
  render(); save();
}

// ---- Export ----
function exportRetro() {
  const sprint = document.getElementById('sprint-name').value || 'Rétrospective';
  const tplName = { classic:'Classique', '4l':'4L', starfish:'Starfish', speedboat:'Speed Boat' }[currentTpl];
  let text = `RÉTROSPECTIVE — ${sprint}\nFormat : ${tplName}\n${'='.repeat(50)}\n\n`;
  for (const col of Object.values(columns)) {
    text += `${colMeta(col).title.toUpperCase()} (${col.cards.length})\n${'-'.repeat(40)}\n`;
    [...col.cards].sort((a,b)=>b.votes-a.votes).forEach((c,i) => {
      const auth = !isAnon && c.author ? ` [${c.author}]` : '';
      text += `  ${i+1}. ${c.text}${c.votes>0 ? ` (${c.votes} vote${c.votes>1?'s':''})` : ''}${auth}\n`;
    });
    text += '\n';
  }
    text += `Généré le ${new Date().toLocaleDateString('fr-FR')} — PO Toolkit`;
  document.getElementById('export-text').textContent = text;
  document.getElementById('export-modal').classList.add('open');
}
function copyExport(btn) {
  navigator.clipboard.writeText(document.getElementById('export-text').textContent).then(() => {
    btn.textContent = 'Copié !';
    setTimeout(() => btn.textContent = 'Copier', 2000);
  });
}
function closeExport() { document.getElementById('export-modal').classList.remove('open'); }

// ---- Session ----
function genId() { return Math.random().toString(36).substring(2,8).toUpperCase(); }
function getSessionId() {
  const p = new URLSearchParams(window.location.search).get('session');
  if (p) return p;
  return localStorage.getItem(APP_KEY+'-last-session') || genId();
}
function changeSession(v) {
  if(!v.trim()) return;
  const id = v.trim().toUpperCase();
  document.getElementById('session-id').value = id;
  localStorage.setItem(APP_KEY+'-last-session', id);
  const u = new URL(window.location); u.searchParams.set('session', id);
  window.history.replaceState({}, '', u);
  load();
}
function newSession() { changeSession(genId()); }
function copySessionLink(btn) {
  const u = new URL(window.location);
  u.searchParams.set('session', document.getElementById('session-id').value);
  navigator.clipboard.writeText(u.toString()).then(() => {
    btn.textContent = 'Copié !';
    setTimeout(() => btn.textContent = 'Copier le lien', 2000);
  });
}
let _ablyReceiving = false;
function save() {
  const id = document.getElementById('session-id').value;
  ensureParticipant();
  const data = { tpl: currentTpl, columns, sprint: document.getElementById('sprint-name').value, anon: isAnon, owner: sessionOwner, participants };
  localStorage.setItem(APP_KEY+'-session-'+id, JSON.stringify(data));
  localStorage.setItem(APP_KEY+'-last-session', id);
  if (!_ablyReceiving && window.ablySync) ablySync.broadcast(data);
  renderParticipants();
}
function load() {
  const id = document.getElementById('session-id').value;
  const raw = localStorage.getItem(APP_KEY+'-session-'+id);
  if (raw) {
    try {
      const d = JSON.parse(raw);
      currentTpl = d.tpl || 'classic';
      columns = d.columns || {};
      isAnon = d.anon || false;
      sessionOwner = d.owner || '';
      participants = d.participants || [];
      document.getElementById('anon-cb').checked = isAnon;
      document.getElementById('sprint-name').value = d.sprint || '';
      document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
      const names = ['classic','4l','starfish','speedboat'];
      const idx = names.indexOf(currentTpl);
      if (idx >= 0) document.querySelectorAll('.tbtn')[idx].classList.add('active');
      ensureParticipant();
      render();
      renderParticipants();
      applyOwnerLock();
    } catch(e) { console.warn(e); setTpl('classic'); }
  } else {
    sessionOwner = myPseudo || '';
    participants = [];
    ensureParticipant();
    setTpl('classic');
    renderParticipants();
  }
}
function initSession() {
  const id = getSessionId();
  document.getElementById('session-id').value = id;
  localStorage.setItem(APP_KEY+'-last-session', id);
  const u = new URL(window.location); u.searchParams.set('session', id);
  window.history.replaceState({}, '', u);
  load();
}

// ---- Sync (cross-tab + Ably real-time) ----
function mergeIncoming(incoming) {
  const incomingCols = incoming.columns || {};
  for (const colKey of Object.keys(incomingCols)) {
    if (!columns[colKey]) {
      columns[colKey] = incomingCols[colKey];
      continue;
    }
    const localById = new Map(columns[colKey].cards.map(c => [c.id, c]));
    const incomingCards = incomingCols[colKey].cards || [];
    incomingCards.forEach(c => localById.set(c.id, c));
    columns[colKey].cards = Array.from(localById.values());
  }
  for (const colKey of Object.keys(columns)) {
    if (!incomingCols[colKey]) delete columns[colKey];
  }
  if (incoming.tpl && incoming.tpl !== currentTpl) {
    currentTpl = incoming.tpl;
    document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
    const names = ['classic','4l','starfish','speedboat'];
    const idx = names.indexOf(currentTpl);
    if (idx >= 0) document.querySelectorAll('.tbtn')[idx].classList.add('active');
  }
  if (incoming.sprint !== undefined) {
    document.getElementById('sprint-name').value = incoming.sprint;
  }
  if (incoming.anon !== undefined) {
    isAnon = incoming.anon;
    document.getElementById('anon-cb').checked = isAnon;
  }
  if (incoming.owner) sessionOwner = incoming.owner;
  if (incoming.participants) {
    participants = incoming.participants;
    ensureParticipant();
  }
  render();
  renderParticipants();
  applyOwnerLock();
}

window.addEventListener('storage', (event) => {
  const id = document.getElementById('session-id').value;
  if (event.key !== APP_KEY + '-session-' + id || !event.newValue) return;
  try {
    _ablyReceiving = true;
    mergeIncoming(JSON.parse(event.newValue));
    _ablyReceiving = false;
  } catch(e) { _ablyReceiving = false; }
});

// Ably real-time (cross-device)
function joinAblyChannel() {
  if (!window.ablySync) return;
  const id = document.getElementById('session-id').value;
  ablySync.join('retro:' + id, (data) => {
    try {
      _ablyReceiving = true;
      mergeIncoming(data);
      _ablyReceiving = false;
    } catch(e) { _ablyReceiving = false; }
  });
}

// ---- Init ----
function init() {
  const saved = localStorage.getItem(APP_KEY+'-pseudo');
  if (saved) {
    myPseudo = saved;
    document.getElementById('pseudo-modal').classList.add('hidden');
    document.getElementById('my-pseudo').value = myPseudo;
    document.getElementById('my-avatar').textContent = avatarLetter(myPseudo);
    document.getElementById('my-avatar').className = 'kit-avatar tint-' + tintOf(myPseudo);
  } else {
    setTimeout(() => document.getElementById('pseudo-input').focus(), 100);
  }
  initSession();
  joinAblyChannel();
}
init();
