<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de Priorisation — PO Toolkit</title>
<link rel="stylesheet" href="app-kit.css">
<script src="app-kit.js"></script>
<style>
  :root { --card: var(--surface); --muted: var(--text-3); --red: var(--danger); }
  .app { display: flex; min-height: calc(100vh - var(--kit-bar-h)); }

  /* Barre latérale des méthodes */
  .sidebar { position: sticky; top: var(--kit-bar-h); align-self: flex-start; width: 280px; height: calc(100vh - var(--kit-bar-h)); flex-shrink: 0; overflow-y: auto; padding: 28px 16px 24px; border-right: 1px solid var(--border); }
  .sidebar h1 { padding: 0 8px; font-family: var(--font-serif); font-size: 26px; font-weight: 500; line-height: 1.15; }
  .sidebar .subtitle { margin: 4px 0 20px; padding: 0 8px; font-size: 13px; color: var(--text-3); }
  .method-list { display: flex; flex-direction: column; gap: 1px; margin: 0; padding: 0; list-style: none; }
  .method-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--radius-sm); font-size: 13.5px; color: var(--text-2); cursor: pointer; transition: background 0.12s, color 0.12s; }
  .method-item:hover { background: var(--surface-2); color: var(--text); }
  .method-item.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm), inset 3px 0 0 var(--app); }
  .method-item .method-abbr { display: grid; place-items: center; width: 24px; height: 20px; border-radius: 5px; background: var(--surface-3); font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--text-3); }
  .method-item.active .method-abbr { background: var(--app); color: var(--surface); }
  .method-info { margin-top: 20px; padding: 16px; border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--surface); }
  .method-info h3 { margin-bottom: 6px; font-size: 13.5px; font-weight: 600; }
  .method-info p { font-size: 12.5px; line-height: 1.55; color: var(--text-2); }
  .method-info .formula { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
  .method-info .when { margin-top: 12px; }
  .method-info .when strong { display: block; margin-bottom: 2px; color: var(--text); font-weight: 600; }

  /* Contenu */
  .main-content { flex: 1; min-width: 0; padding: 28px 32px 64px; }
  .main-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .main-header h2 { font-family: var(--font-serif); font-size: 30px; font-weight: 500; letter-spacing: -0.015em; }
  .header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .file-btn input { display: none; }

  /* Critères */
  .criteria-bar { margin-bottom: 16px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
  .criteria-bar h3 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
  .criteria-bar h3 .hint { font-size: 12.5px; font-weight: 400; color: var(--text-3); }
  .criteria-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .crit-group { width: 100%; margin: 6px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--app); }
  .crit-group:first-child { margin-top: 0; }
  .criterion-tag { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 11px; border: 1px solid color-mix(in oklab, var(--app) 25%, var(--border)); border-radius: 7px; background: var(--app-soft); font-size: 13px; }
  .criterion-tag .crit-name { color: var(--app); }
  .criterion-tag .crit-name { font-weight: 500; color: var(--text); }
  .criterion-tag .crit-x { font-size: 11px; color: var(--text-4); }
  .criterion-tag input[type="number"] { width: 50px; height: 24px; padding: 0 4px; border-radius: 5px; font-family: var(--font-mono); font-size: 12px; text-align: center; }
  .criterion-tag .remove-crit { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--text-4); font-size: 14px; cursor: pointer; }
  .criterion-tag .remove-crit:hover { background: var(--danger-soft); color: var(--danger); }
  .criterion-tag.custom { border-style: dashed; border-color: var(--border-strong); background: var(--surface); }
  .criterion-tag.custom .crit-name { color: var(--text); }
  .add-criterion { display: flex; gap: 6px; align-items: center; }
  .add-criterion.full { width: 100%; margin-top: 6px; }
  .add-criterion input { width: 240px; height: 32px; padding: 0 10px; font-size: 13px; }

  /* Tableau */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th { background: var(--surface-2); }
  th { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
  th.score-col, th.rank-col { text-align: center; }
  th.score-col { background: var(--app-soft); color: var(--app); }
  th.id-col, th.act-col { width: 44px; }
  th.name-col { min-width: 220px; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: color-mix(in oklch, var(--surface-2) 60%, transparent); }
  td.id-cell { font-family: var(--font-mono); font-size: 12px; color: var(--text-4); }
  td input[type="text"] { width: 100%; height: 32px; padding: 0 8px; border-color: transparent; background: transparent; font-weight: 500; }
  td input[type="text"]:hover { border-color: var(--border); }
  td input[type="text"]:focus { background: var(--surface); }
  td input[type="number"], td select { width: 100%; min-width: 80px; height: 32px; padding: 0 8px; font-size: 13px; }
  td input[type="number"] { font-family: var(--font-mono); }
  td select { cursor: pointer; }
  .score-cell { text-align: center; background: color-mix(in oklch, var(--app-soft) 55%, transparent); font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--app); font-variant-numeric: tabular-nums; }
  .rank-cell { text-align: center; color: var(--text-4); }
  .rank-badge { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
  .rank-1 { background: var(--app); color: var(--surface); }
  .rank-2 { background: color-mix(in oklab, var(--app) 55%, var(--surface)); color: var(--surface); }
  .rank-3 { background: var(--app-soft); color: var(--app); }
  .rank-other { background: var(--surface-3); color: var(--text-3); }
  .delete-row { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--text-4); cursor: pointer; }
  .delete-row:hover { background: var(--danger-soft); color: var(--danger); }
  .add-row { margin-top: 10px; }

  /* Classement */
  .results-panel { margin-top: 20px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
  .results-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
  .results-header h3 { font-family: var(--font-serif); font-size: 21px; font-weight: 500; }
  .ranking-list { padding: 4px 8px 10px; }
  .ranking-item { display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 8px; }
  .ranking-item:hover { background: var(--surface-2); }
  .ranking-item .rank { min-width: 28px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-4); }
  .ranking-item .rank.gold, .ranking-item .rank.silver, .ranking-item .rank.bronze { color: var(--app); font-weight: 600; }
  .ranking-item.podium .item-name { font-weight: 600; }
  .ranking-item.first { background: var(--app-soft); }
  .ranking-item.first:hover { background: var(--app-soft); }
  .ranking-item.first .ranking-bar { background: color-mix(in oklch, var(--surface) 70%, transparent); }
  .ranking-item .item-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .ranking-item .item-score { min-width: 84px; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
  .ranking-bar { flex: 1; max-width: 220px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .ranking-bar-fill { height: 100%; border-radius: inherit; background: color-mix(in oklab, var(--app) 30%, var(--app-soft)); transition: width 0.4s var(--ease); }
  .podium .ranking-bar-fill { background: color-mix(in oklab, var(--app) 65%, var(--app-soft)); }
  .first .ranking-bar-fill { background: var(--app); }

  /* Export */
  .export-modal { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); }
  .export-modal.open { display: flex; }
  .export-box { width: 100%; max-width: 640px; max-height: 82vh; overflow-y: auto; padding: 26px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lg); }
  .export-box h2 { margin-bottom: 14px; font-family: var(--font-serif); font-size: 24px; font-weight: 500; }
  .export-box pre { margin: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; }
  .export-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* MoSCoW */
  .moscow-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .moscow-M { background: var(--danger-soft); color: var(--danger); }
  .moscow-S { background: var(--warn-soft); color: var(--warn-text); }
  .moscow-C { background: var(--accent-soft); color: var(--accent-text); }
  .moscow-W { background: var(--surface-3); color: var(--text-3); }

  @media (max-width: 1100px) {
    .sidebar { width: 230px; }
    .method-info { display: none; }
  }
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { position: static; width: 100%; height: auto; padding: 20px 16px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
    .method-list { flex-direction: row; flex-wrap: wrap; gap: 4px; }
    .main-content { padding: 20px 16px 48px; }
  }
</style>
</head>
<body data-app="Calculateur de priorisation" data-tint="5" data-icon="list" data-section="Cadrage &amp; priorisation">
<div class="app">
  <aside class="sidebar">
    <div data-kit-head>
    <h1>Priorisation</h1>
    <p class="subtitle">Comparez et classez votre backlog.</p>
    </div>

    <ul class="method-list" id="method-list"></ul>

    <div class="method-info" id="method-info"></div>
  </aside>

  <main class="main-content" id="main"></main>
</div>

<div class="export-modal" id="export-modal">
  <div class="export-box">
    <h2>Export</h2>
    <pre id="export-text"></pre>
    <div class="export-actions">
      <button class="btn-secondary" onclick="document.getElementById('export-modal').classList.remove('open')">Fermer</button>
      <button class="btn-primary" onclick="copyExport()">Copier</button>
    </div>
  </div>
</div>

<script>
// ===============================
// METHOD DEFINITIONS
// ===============================
const METHODS = {
  rice: {
    name: "RICE Scoring",
    abbr: "RI",
    icon: "",
    color: "#6366f1",
    description: "Framework quantitatif développé par Intercom. Évalue chaque item sur 4 dimensions pour obtenir un score objectif et comparable.",
    formula: "Score = (Reach × Impact × Confidence) ÷ Effort",
    when: "Quand vous avez un backlog conséquent et voulez éliminer les biais subjectifs. Idéal pour comparer 10+ items.",
    coreCriteria: [
      { id: "reach", name: "Reach", description: "Nb utilisateurs touchés / trimestre", type: "number", min: 0, max: 100000, step: 100, default: 1000 },
      { id: "impact", name: "Impact", description: "Impact par utilisateur", type: "select", options: [{v:3,l:"3 — Massif"},{v:2,l:"2 — Haut"},{v:1,l:"1 — Moyen"},{v:0.5,l:"0.5 — Faible"},{v:0.25,l:"0.25 — Minimal"}], default: 1 },
      { id: "confidence", name: "Confidence", description: "Niveau de certitude (%)", type: "select", options: [{v:100,l:"100% — Haute"},{v:80,l:"80% — Moyenne"},{v:60,l:"60% — Correcte"},{v:50,l:"50% — Faible"},{v:40,l:"40% — Très faible"}], default: 80 },
      { id: "effort", name: "Effort", description: "Person-months", type: "number", min: 0.1, max: 50, step: 0.5, default: 1, isDivisor: true },
    ],
    calculate: (values, weights) => {
      const w = weights;
      let numerator = 1;
      let divisor = 1;
      for (const [key, val] of Object.entries(values)) {
        const crit = METHODS.rice.allCriteria.find(c => c.id === key);
        if (!crit) continue;
        const weight = w[key] || 1;
        if (crit.isDivisor) {
          divisor *= Math.pow(val || 1, weight);
        } else {
          numerator *= Math.pow(val || 1, weight);
        }
      }
      return divisor > 0 ? numerator / divisor : 0;
    }
  },
  wsjf: {
    name: "WSJF (SAFe)",
    abbr: "WS",
    icon: "",
    color: "#a855f7",
    description: "Weighted Shortest Job First — utilisé dans SAFe pour prioriser au niveau du Program Increment. Le ratio Cost of Delay / Job Size maximise la valeur livrée par unité de temps.",
    formula: "WSJF = Cost of Delay ÷ Job Size\nCoD = (User Value × poids) + (Time Criticality × poids) + (Risk Reduction × poids)",
    when: "PI Planning SAFe, arbitrage entre features au niveau programme, quand le coût du délai est critique. Ajustez les poids pour refléter l'importance relative de chaque composante du CoD.",
    coreCriteria: [
      { id: "user_value", name: "User/Business Value", group: "Cost of Delay", description: "Valeur pour l'utilisateur ou le business", type: "select", options: [{v:1,l:"1"},{v:2,l:"2"},{v:3,l:"3"},{v:5,l:"5"},{v:8,l:"8"},{v:13,l:"13"},{v:21,l:"21"}], default: 5 },
      { id: "time_crit", name: "Time Criticality", group: "Cost of Delay", description: "Urgence / fenêtre d'opportunité", type: "select", options: [{v:1,l:"1"},{v:2,l:"2"},{v:3,l:"3"},{v:5,l:"5"},{v:8,l:"8"},{v:13,l:"13"},{v:21,l:"21"}], default: 3 },
      { id: "risk_reduction", name: "Risk Reduction / Opportunity", group: "Cost of Delay", description: "Réduction de risque ou opportunité", type: "select", options: [{v:1,l:"1"},{v:2,l:"2"},{v:3,l:"3"},{v:5,l:"5"},{v:8,l:"8"},{v:13,l:"13"},{v:21,l:"21"}], default: 3 },
      { id: "job_size", name: "Job Size", group: "Diviseur", description: "Taille du travail (effort)", type: "select", options: [{v:1,l:"1"},{v:2,l:"2"},{v:3,l:"3"},{v:5,l:"5"},{v:8,l:"8"},{v:13,l:"13"},{v:21,l:"21"}], default: 5, isDivisor: true },
    ],
    calculate: (values, weights) => {
      const w = weights;
      let cod = 0;
      let jobSize = 1;
      for (const [key, val] of Object.entries(values)) {
        const crit = METHODS.wsjf.allCriteria.find(c => c.id === key);
        if (!crit) continue;
        const weight = w[key] || 1;
        if (crit.isDivisor) {
          jobSize = (val || 1) * weight;
        } else {
          cod += (val || 0) * weight;
        }
      }
      return jobSize > 0 ? cod / jobSize : 0;
    }
  },
  value_effort: {
    name: "Value vs Effort",
    abbr: "VE",
    icon: "",
    color: "#10b981",
    description: "Matrice simple et universelle. Évalue chaque item sur la valeur apportée et l'effort requis. Le ratio identifie les Quick Wins (haute valeur, faible effort).",
    formula: "Score = Valeur pondérée ÷ Effort pondéré",
    when: "Priorisation rapide en atelier, premier tri du backlog, alignement équipe sans framework lourd.",
    coreCriteria: [
      { id: "value", name: "Valeur", description: "Valeur business/utilisateur (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
      { id: "effort", name: "Effort", description: "Effort de réalisation (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5, isDivisor: true },
    ],
    calculate: (values, weights) => {
      let num = 0, den = 0;
      for (const [key, val] of Object.entries(values)) {
        const crit = METHODS.value_effort.allCriteria.find(c => c.id === key);
        if (!crit) continue;
        const weight = weights[key] || 1;
        if (crit.isDivisor) den += (val || 1) * weight;
        else num += (val || 0) * weight;
      }
      return den > 0 ? num / den : 0;
    }
  },
  moscow: {
    name: "MoSCoW",
    abbr: "MO",
    icon: "",
    color: "#f59e0b",
    description: "Classification en 4 catégories : Must have, Should have, Could have, Won't have. Pas un scoring — une classification pour la négociation de scope.",
    formula: "Classification : M (≤60%) > S (~20%) > C (~20%) > W",
    when: "MVP, release planning, négociation de scope avec stakeholders. Quand il faut trancher vite.",
    coreCriteria: [
      { id: "moscow", name: "Catégorie MoSCoW", description: "M / S / C / W", type: "select", options: [{v:4,l:"Must Have"},{v:3,l:"Should Have"},{v:2,l:"Could Have"},{v:1,l:"Won't Have"}], default: 3 },
    ],
    calculate: (values, weights) => {
      return (values.moscow || 0);
    },
    isCategorical: true
  },
  ice: {
    name: "ICE Scoring",
    abbr: "IC",
    icon: "",
    color: "#ec4899",
    description: "Framework simple de Sean Ellis (Growth Hacking). Chaque dimension est notée 1-10. Plus intuitif que RICE, mais plus subjectif.",
    formula: "Score = Impact × Confidence × Ease",
    when: "Growth experiments, feature prioritization rapide quand vous n'avez pas de données quantitatives de Reach.",
    coreCriteria: [
      { id: "impact", name: "Impact", description: "Impact attendu (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
      { id: "confidence", name: "Confidence", description: "Niveau de certitude (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
      { id: "ease", name: "Ease", description: "Facilité de mise en œuvre (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
    ],
    calculate: (values, weights) => {
      let result = 1;
      for (const [key, val] of Object.entries(values)) {
        const w = weights[key] || 1;
        result *= Math.pow(val || 1, w);
      }
      return result;
    }
  },
  weighted: {
    name: "Scoring pondéré",
    abbr: "SP",
    icon: "",
    color: "#64748b",
    description: "Scoring pondéré simple avec critères génériques fixes.",
    formula: "Score = Somme(critère × poids) / Somme(poids)",
    when: "Utile si vous voulez un calcul simple sans entrer dans un cadre strict.",
    coreCriteria: [
      { id: "impact", name: "Impact", description: "Impact global (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
      { id: "fit", name: "Strategic Fit", description: "Alignement stratégique (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
      { id: "confidence", name: "Confidence", description: "Niveau de confiance (1-10)", type: "number", min: 1, max: 10, step: 1, default: 5 },
    ],
    calculate: (values, weights) => {
      let totalWeighted = 0;
      let totalWeight = 0;
      for (const [key, val] of Object.entries(values)) {
        const w = weights[key] || 1;
        totalWeighted += (val || 0) * w;
        totalWeight += w;
      }
      return totalWeight > 0 ? totalWeighted / totalWeight : 0;
    }
  }
};

// ===============================
// STATE
// ===============================
let currentMethod = 'rice';
let items = [];
let customCriteria = [];
let criteriaWeights = {};
let nextItemId = 1;
const STORAGE_KEY = 'po-toolkit-prioritization-calculator-v1';
const DEFAULT_SAMPLE_NAME = 'Exemple de feature';

function getMethod() { return METHODS[currentMethod]; }
function canAddCriteria() { return currentMethod === 'wsjf'; }

function getAllCriteria() {
  const m = getMethod();
  let all = [...(m.coreCriteria || [])];
  if (canAddCriteria() && customCriteria.length > 0) {
    const divisorIndex = all.findIndex(c => c.isDivisor);
    const wsjfCustomCriteria = customCriteria.map(c => ({ ...c, group: 'Cost of Delay', isCustom: true }));
    all = divisorIndex === -1
      ? [...all, ...wsjfCustomCriteria]
      : [...all.slice(0, divisorIndex), ...wsjfCustomCriteria, ...all.slice(divisorIndex)];
  }
  m.allCriteria = all;
  return all;
}

function getDefaultValue(crit) {
  if (crit.default !== undefined) return crit.default;
  if (crit.type === 'number') return crit.min || 0;
  if (crit.options && crit.options.length > 0) return crit.options[0].v;
  return 0;
}

function createDefaultValues() {
  const values = {};
  for (const crit of getAllCriteria()) {
    values[crit.id] = getDefaultValue(crit);
  }
  return values;
}

function createExampleItem() {
  return { id: nextItemId++, name: DEFAULT_SAMPLE_NAME, values: createDefaultValues(), score: 0, rank: null };
}

function ensureDefaultItem() {
  if (items.length === 0) items.push(createExampleItem());
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentMethod,
      items,
      customCriteria,
      criteriaWeights,
      nextItemId,
    }));
  } catch (error) {
    // The calculator still works without localStorage.
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;

    const state = JSON.parse(raw);
    if (!state || !METHODS[state.currentMethod]) return false;

    currentMethod = state.currentMethod;
    customCriteria = Array.isArray(state.customCriteria) ? state.customCriteria : [];
    if (!canAddCriteria()) customCriteria = [];
    criteriaWeights = state.criteriaWeights && typeof state.criteriaWeights === 'object' ? state.criteriaWeights : {};
    nextItemId = Number.isFinite(state.nextItemId) && state.nextItemId > 0 ? state.nextItemId : 1;
    items = Array.isArray(state.items) ? state.items.map(item => ({
      id: Number.isFinite(item.id) ? item.id : nextItemId++,
      name: item.name || '',
      values: item.values && typeof item.values === 'object' ? item.values : {},
      score: Number.isFinite(item.score) ? item.score : 0,
      rank: Number.isFinite(item.rank) ? item.rank : null,
    })) : [];

    const criteria = getAllCriteria();
    const validIds = new Set(criteria.map(crit => crit.id));

    items = items.map(item => {
      const values = {};
      for (const crit of criteria) {
        values[crit.id] = item.values[crit.id] !== undefined ? item.values[crit.id] : getDefaultValue(crit);
      }
      return { ...item, values };
    });

    criteriaWeights = Object.fromEntries(
      Object.entries(criteriaWeights)
        .filter(([id]) => validIds.has(id))
        .map(([id, weight]) => [id, parseFloat(weight) || 1])
    );

    for (const crit of criteria) {
      if (!criteriaWeights[crit.id]) criteriaWeights[crit.id] = 1;
    }

    ensureDefaultItem();
    return true;
  } catch (error) {
    return false;
  }
}

function fmtScore(n) {
  return Number(n).toLocaleString('fr-FR', { maximumFractionDigits: Math.abs(n) >= 100 ? 0 : 1 });
}

// ===============================
// RENDER: Sidebar
// ===============================
function renderSidebar() {
  const list = document.getElementById('method-list');
  list.innerHTML = Object.entries(METHODS).map(([key, m]) =>
    `<li class="method-item ${key === currentMethod ? 'active' : ''}" onclick="switchMethod('${key}')">
      <span class="method-abbr">${m.abbr || m.name.slice(0, 2)}</span> ${m.name}
    </li>`
  ).join('');

  const m = getMethod();
  document.getElementById('method-info').innerHTML = `
    <h3>${m.name}</h3>
    <p>${m.description}</p>
    <div class="formula">${m.formula}</div>
    <p class="when"><strong>Quand l'utiliser</strong>${m.when}</p>
  `;
}

// ===============================
// RENDER: Criteria Bar
// ===============================
function renderCriteriaBar() {
  const criteria = getAllCriteria();
  const allowCustomCriteria = canAddCriteria();

  let html = `<div class="criteria-bar">
    <h3>Critères <span class="hint">${criteria.length} · poids ajustables</span></h3>
    <div class="criteria-list">`;

  let lastGroup = null;
  for (const crit of criteria) {
    const weight = criteriaWeights[crit.id] || 1;

    if (crit.group && crit.group !== lastGroup) {
      if (allowCustomCriteria && lastGroup === 'Cost of Delay' && crit.group === 'Diviseur') {
        html += `
      <div class="add-criterion full">
        <input type="text" id="new-crit-name" placeholder="Ajouter une sous-composante CoD" onkeydown="if(event.key==='Enter'){event.preventDefault();addCriterion();}">
        <button class="btn-secondary btn-small" onclick="addCriterion()">Ajouter</button>
      </div>`;
      }
      html += `<span class="crit-group">${crit.group}</span>`;
      lastGroup = crit.group;
    }

    html += `
      <div class="criterion-tag ${crit.isCustom ? 'custom' : 'core'}" title="${crit.description || ''}">
        <span class="crit-name">${crit.name}</span>
        <span class="crit-x">&times;</span>
        <input type="number" value="${weight}" min="0.1" max="10" step="0.1"
               onchange="updateWeight('${crit.id}', this.value)" title="Poids du critère">
        ${crit.isCustom ? `<button class="remove-crit" onclick="removeCriterion('${crit.id}')" title="Supprimer" aria-label="Supprimer le critère">&times;</button>` : ''}
      </div>`;
  }

  html += `
    </div>
  </div>`;

  return html;
}

// ===============================
// RENDER: Table
// ===============================
function renderTable() {
  const criteria = getAllCriteria();
  const m = getMethod();

  // Calculate scores
  for (const item of items) {
    item.score = m.calculate(item.values, criteriaWeights);
  }

  // Rank
  const sorted = [...items].filter(i => i.values && Object.keys(i.values).length > 0).sort((a, b) => b.score - a.score);
  sorted.forEach((item, i) => { item.rank = i + 1; });
  items.filter(i => !sorted.includes(i)).forEach(i => { i.rank = null; });

  let html = `<div class="table-wrap"><table>
    <thead><tr>
      <th class="id-col">#</th>
      <th class="name-col">Feature / Story</th>`;

  for (const crit of criteria) {
    html += `<th>${crit.name}</th>`;
  }

  html += `<th class="score-col">Score</th>
    <th class="rank-col">Rang</th>
    <th class="act-col"></th>
    </tr></thead><tbody>`;

  for (const item of items) {
    html += `<tr>
      <td class="id-cell">${item.id}</td>
      <td><input type="text" value="${escapeAttr(item.name)}" onchange="updateItemName(${item.id}, this.value)" placeholder="Nom de la feature"></td>`;

    for (const crit of criteria) {
      const val = item.values[crit.id];
      if (crit.type === 'select') {
        html += `<td><select onchange="updateValue(${item.id}, '${crit.id}', parseFloat(this.value))">`;
        for (const opt of crit.options) {
          html += `<option value="${opt.v}" ${val == opt.v ? 'selected' : ''}>${opt.l}</option>`;
        }
        html += `</select></td>`;
      } else {
        html += `<td><input type="number" value="${val !== undefined ? val : ''}"
                  min="${crit.min || 0}" max="${crit.max || 100}" step="${crit.step || 1}"
                  onchange="updateValue(${item.id}, '${crit.id}', parseFloat(this.value))"
                  placeholder="${crit.default || 0}"></td>`;
      }
    }

    const scoreDisplay = item.score !== undefined ? (m.isCategorical ?
      ['','Won\'t','Could','Should','Must'][Math.round(item.score)] || item.score.toFixed(1) :
      fmtScore(item.score)) : '-';

    const rankClass = item.rank === 1 ? 'rank-1' : item.rank === 2 ? 'rank-2' : item.rank === 3 ? 'rank-3' : 'rank-other';

    html += `<td class="score-cell">${scoreDisplay}</td>`;
    html += `<td class="rank-cell">${item.rank ? `<span class="rank-badge ${rankClass}">${item.rank}</span>` : '-'}</td>`;
    html += `<td><button class="delete-row" onclick="removeItem(${item.id})" title="Supprimer" aria-label="Supprimer la ligne"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></td>`;
    html += `</tr>`;
  }

  html += `</tbody></table></div>`;
  html += `<button class="btn-secondary add-row" onclick="addItem()">+ Ajouter une feature</button>`;

  return html;
}

// ===============================
// RENDER: Results
// ===============================
function renderResults() {
  const m = getMethod();
  const scored = items.filter(i => i.score !== undefined && i.name).sort((a, b) => b.score - a.score);
  if (scored.length === 0) return '';

  const maxScore = scored[0].score || 1;

  let html = `<div class="results-panel">
    <div class="results-header">
      <h3>Classement</h3>
      <button class="btn-ghost btn-small" onclick="exportResults()">Exporter</button>
    </div>
    <div class="ranking-list">`;

  for (let i = 0; i < scored.length; i++) {
    const item = scored[i];
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const pct = maxScore > 0 ? (item.score / maxScore * 100) : 0;
    const display = m.isCategorical ? ['','Won\'t','Could','Should','Must'][Math.round(item.score)] || item.score.toFixed(1) : fmtScore(item.score);

    html += `<div class="ranking-item ${i < 3 ? 'podium' : ''} ${i === 0 ? 'first' : ''}">
      <span class="rank ${rankClass}">${String(i + 1).padStart(2, '0')}</span>
      <span class="item-name">${item.name || 'Sans nom'}</span>
      <div class="ranking-bar"><div class="ranking-bar-fill" style="width:${pct}%"></div></div>
      <span class="item-score">${display}</span>
    </div>`;
  }

  html += `</div></div>`;
  return html;
}

// ===============================
// RENDER: Main
// ===============================
function render() {
  renderSidebar();
  const m = getMethod();

  document.getElementById('main').innerHTML = `
    <div class="main-header">
      <h2>${m.name}</h2>
      <div class="header-actions">
        <button class="btn-ghost" onclick="resetAll()">Réinitialiser</button>
        <label class="btn-secondary file-btn">
          Importer CSV
          <input type="file" accept=".csv" id="import-csv-input" onchange="importCsv(this.files[0]);this.value='';">
        </label>
        <button class="btn-primary" onclick="exportResults()">Exporter</button>
      </div>
    </div>
    ${renderCriteriaBar()}
    ${renderTable()}
    ${renderResults()}
  `;

  saveState();
}

// ===============================
// ACTIONS
// ===============================
function switchMethod(key) {
  currentMethod = key;
  customCriteria = [];
  criteriaWeights = {};
  const m = getMethod();
  m.coreCriteria.forEach(c => { criteriaWeights[c.id] = 1; });

  for (const item of items) {
    item.values = {};
    for (const crit of getAllCriteria()) {
      item.values[crit.id] = getDefaultValue(crit);
    }
  }

  ensureDefaultItem();
  render();
}

function addItem() {
  items.push({ id: nextItemId++, name: '', values: createDefaultValues(), score: 0, rank: null });
  render();
}

function removeItem(id) {
  items = items.filter(i => i.id !== id);
  render();
}

function updateItemName(id, name) {
  const item = items.find(i => i.id === id);
  if (item) { item.name = name; render(); }
}

function updateValue(id, critId, value) {
  const item = items.find(i => i.id === id);
  if (item) { item.values[critId] = value; render(); }
}

function updateWeight(critId, value) {
  criteriaWeights[critId] = parseFloat(value) || 1;
  render();
}

function addCriterion() {
  if (!canAddCriteria()) return;
  const input = document.getElementById('new-crit-name');
  if (!input) return;
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const id = 'custom_' + Date.now() + '_' + name.toLowerCase().replace(/[^a-z0-9_]/g, '_').substring(0, 20);
  if (customCriteria.some(c => c.name.toLowerCase() === name.toLowerCase())) return;

  const newCrit = {
    id, name, description: 'Sous-composante personnalisée du Cost of Delay', type: 'number',
    min: 1, max: 21, step: 1, default: 3, group: 'Cost of Delay', isCustom: true
  };
  customCriteria.push(newCrit);
  criteriaWeights[id] = 1;

  for (const item of items) {
    item.values[id] = newCrit.default;
  }
  input.value = '';
  render();
}

function removeCriterion(id) {
  if (!canAddCriteria()) return;
  customCriteria = customCriteria.filter(c => c.id !== id);
  delete criteriaWeights[id];
  for (const item of items) {
    delete item.values[id];
  }
  render();
}

function resetAll() {
  if (!confirm('Réinitialiser toutes les données ?')) return;
  items = [];
  customCriteria = [];
  criteriaWeights = {};
  getMethod().coreCriteria.forEach(c => { criteriaWeights[c.id] = 1; });
  nextItemId = 1;
  ensureDefaultItem();
  render();
}

function escapeAttr(str) {
  return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function exportResults() {
  const m = getMethod();
  const criteria = getAllCriteria();
  const scored = items.filter(i => i.name).sort((a, b) => b.score - a.score);

  let text = `PRIORISATION — ${m.name}\n${'='.repeat(50)}\n`;
  text += `Méthode : ${m.name}\n`;
  text += `Formule : ${m.formula}\n`;
  if (customCriteria.length > 0) {
    text += `Critères custom : ${customCriteria.map(c => c.name).join(', ')}\n`;
  }
  text += `\n${'─'.repeat(50)}\n\n`;

  text += `CLASSEMENT\n`;
  for (let i = 0; i < scored.length; i++) {
    const item = scored[i];
    const display = m.isCategorical ? ['','Won\'t','Could','Should','Must'][Math.round(item.score)] || item.score.toFixed(1) : item.score.toFixed(1);
    text += `  ${i+1}. ${item.name} — Score: ${display}\n`;
    for (const crit of criteria) {
      const w = criteriaWeights[crit.id] || 1;
      text += `     ${crit.name}: ${item.values[crit.id]} (poids: ${w})\n`;
    }
    text += '\n';
  }

    text += `\nGénéré le ${new Date().toLocaleDateString('fr-FR')} — PO Toolkit`;

  document.getElementById('export-text').textContent = text;
  document.getElementById('export-modal').classList.add('open');
}

function copyExport() {
  const text = document.getElementById('export-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    event.target.textContent = 'Copié !';
    setTimeout(() => event.target.textContent = 'Copier', 2000);
  });
}

// ===============================
// CSV IMPORT
// ===============================
function importCsv(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result.replace(/^\uFEFF/, '');
    const sep = text.indexOf(';') !== -1 ? ';' : ',';
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return;

    const headers = parseCsvLine(lines[0], sep).map(h => h.trim().toLowerCase());

    // Map columns — flexible matching for user-story-template format
    const nameCol = headers.findIndex(h => /titre|title|feature|story|action|nom/.test(h));
    if (nameCol === -1) { alert('Colonne titre/feature introuvable dans le CSV.'); return; }

    let imported = 0;
    for (let i = 1; i < lines.length; i++) {
      const cells = parseCsvLine(lines[i], sep);
      const name = (cells[nameCol] || '').trim();
      if (!name) continue;

      const item = { id: nextItemId++, name, values: createDefaultValues(), score: 0, rank: null };
      items.push(item);
      imported++;
    }

    if (imported > 0) render();
    alert(`${imported} feature${imported > 1 ? 's' : ''} importée${imported > 1 ? 's' : ''}.`);
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCsvLine(line, sep) {
  const cells = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i + 1] === '"') { current += '"'; i++; }
      else if (ch === '"') { inQuotes = false; }
      else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === sep) { cells.push(current); current = ''; }
      else { current += ch; }
    }
  }
  cells.push(current);
  return cells;
}

// ===============================
// INIT
// ===============================
function init() {
  if (!loadState()) {
    getMethod().coreCriteria.forEach(c => { criteriaWeights[c.id] = 1; });
    ensureDefaultItem();
  }

  render();
}

init();
</script>
